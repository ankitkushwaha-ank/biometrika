<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Biometrika-Core</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-fingerprint.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/db.css"/>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="db-main">
    <div class="topbar" id="topbar">
      <div class="topbar-left"><span class="topbar-page-title">Account</span></div>
    </div>

    <div class="db-content">
      <div class="page-hd">
        <h1>Account</h1>
        <p>Manage your profile and account settings</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">

        <!-- Profile card -->
        <div class="db-card">
          <h2 class="db-card-title">Profile</h2>
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
            <div style="width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex-shrink:0;">A</div>
            <div>
              <div style="font-weight:600;font-size:1rem;">Ankit Kushwaha</div>
              <div style="font-size:.85rem;color:#888;">ankit@example.com</div>
            </div>
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" value="Ankit Kushwaha">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" value="ankit@example.com">
          </div>
          <div class="form-group">
            <label>Company (optional)</label>
            <input type="text" placeholder="Your company">
          </div>
          <button class="btn-primary" onclick="alert('Changes saved')">Save Changes</button>
        </div>

        <!-- Security card -->
        <div style="display:flex;flex-direction:column;gap:1.5rem;">
          <div class="db-card">
            <h2 class="db-card-title">Security</h2>
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-secondary" onclick="alert('Password update — Phase 2')">Update Password</button>
          </div>

          <div class="db-card">
            <h2 class="db-card-title">Plan</h2>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
              <div>
                <div style="font-weight:600;">Free Plan</div>
                <div style="font-size:.83rem;color:#888;">10,000 requests / month</div>
              </div>
              <span class="badge blue">Active</span>
            </div>
            <button class="btn-primary" style="width:100%;" onclick="location.href='../pages/pricing.html'">Upgrade to Pro →</button>
          </div>

          <div class="db-card">
            <h2 class="db-card-title" style="color:#C52B1A;">Danger Zone</h2>
            <p style="font-size:.88rem;color:#666;margin-bottom:1rem;">Permanently delete your account and all associated data. This action cannot be undone.</p>
            <button style="background:#FDECEA;color:#C52B1A;border:1.5px solid #F5C4C0;padding:.65rem 1.35rem;border-radius:8px;font-size:.875rem;font-weight:600;" onclick="alert('Please contact support to delete your account')">Delete Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/db-shell.js"></script>
  <script>renderShell('nav-account');</script>
</body>
</html>
